# Configuration Nginx pour Kubernetes.
# Sert uniquement le frontend Angular : le routage /api est géré par l'Ingress
# (voir k8s/ingress.yaml), il ne doit donc PAS être dupliqué ici.
user nginx_user;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript image/svg+xml;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;

        # Fichiers hashés par Angular : cache long
        location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Routing SPA ; index.html ne doit jamais être mis en cache
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }

        # Probes Kubernetes
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }
    }

    # Port interne pour l'exporter Prometheus (sidecar) : non exposé par Service/Ingress
    server {
        listen 8081;
        server_name _;

        location /stub_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }
}
