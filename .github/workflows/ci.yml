name: CI Frontend

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOYMENT_REPO: RahmDridiCode/recouvra-deployment

jobs:
  # Pas d'étape de tests : angular.json n'a pas de cible "test" et il n'y a aucun *.spec.ts.
  # L'installation (npm ci) et le build Angular sont exécutés par le Dockerfile.
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and tag
        id: vars
        run: |
          # GHCR exige un nom d'image en minuscules
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-deployment:
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Dispatch deploy-image to deployment repository
        env:
          DEPLOYMENT_TOKEN: ${{ secrets.DEPLOYMENT_TOKEN }}
          IMAGE_TAG: ${{ needs.build-push.outputs.tag }}
        run: |
          if [ -z "$DEPLOYMENT_TOKEN" ]; then
            echo "::error::Le secret DEPLOYMENT_TOKEN est absent de ce dépôt."
            exit 1
          fi
          status=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DEPLOYMENT_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DEPLOYMENT_REPO}/dispatches" \
            -d "{\"event_type\":\"deploy-image\",\"client_payload\":{\"component\":\"frontend\",\"tag\":\"${IMAGE_TAG}\"}}")
          if [ "$status" != "204" ]; then
            echo "::error::Échec du repository_dispatch (HTTP $status)."
            cat /tmp/dispatch.out
            exit 1
          fi
          echo "Événement deploy-image envoyé : frontend ${IMAGE_TAG}"
